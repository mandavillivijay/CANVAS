[alembic]
script_location = canvas_heal/migrations

# Connection URL is read from the CANVAS_STORE_URL environment variable at
# runtime inside env.py.  Set it before running alembic commands, e.g.:
#   export CANVAS_STORE_URL=postgresql://user:pass@localhost/canvas
#   alembic upgrade head
sqlalchemy_url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
