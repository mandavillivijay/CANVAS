name: Release

on:
  release:
    types: [published]

jobs:
  sbom-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e . "cyclonedx-bom>=4.0"
      - name: Generate SBOM
        run: |
          mkdir -p sbom
          cyclonedx-py environment --output-format JSON --output-file sbom/sbom.cyclonedx.json
      - name: Attach SBOM to GitHub release
        run: gh release upload ${{ github.ref_name }} sbom/sbom.cyclonedx.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}
