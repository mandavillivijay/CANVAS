[build-system]
requires = ["hatchling", "cyclonedx-bom>=4.0"]
build-backend = "hatchling.build"

[project]
name = "canvas-heal"
version = "0.3.0"
description = "Semantic intent-based self-healing test locators for QE and test automation"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { email = "mvijayfromvizag@gmail.com" }
]
keywords = ["testing", "selenium", "playwright", "self-healing", "test-automation", "semantic", "locator"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "playwright>=1.55.0",
    "sentence-transformers>=5.1.1",
    "numpy>=2.3.3",
    "beautifulsoup4>=4.12.2",
]

[project.scripts]
canvas-heal = "canvas_heal.cli:main"

[project.entry-points."pytest11"]
canvas-heal = "canvas_heal.pytest_plugin"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.1",
    "pytest-cov>=6.0",
    "cyclonedx-bom>=4.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "alembic>=1.12",
    "sqlalchemy>=2.0",
]
selenium = [
    "selenium>=4.0.0",
]
otel = [
    "opentelemetry-api>=1.20.0",
]
postgres = [
    "psycopg[pool]>=3.1",
    "alembic>=1.12",
    "sqlalchemy>=2.0",
]

[project.urls]
Homepage = "https://github.com/mandavillivijay/CANVAS"
Issues = "https://github.com/mandavillivijay/CANVAS/issues"

[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["canvas_heal"]

[tool.pytest.ini_options]
addopts = "--cov=canvas_heal --cov-branch --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["canvas_heal"]
branch = true
omit = ["tests/*", "hatch_build.py", "canvas_heal/cli.py", "canvas_heal/pytest_plugin.py", "canvas_heal/migrations/*", "canvas_heal/backends/postgres.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
