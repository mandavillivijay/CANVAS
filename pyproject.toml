[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "canvas-heal"
version = "0.2.0"
description = "Semantic intent-based self-healing test locators for QE and test automation"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { email = "mvijayfromvizag@gmail.com" }
]
keywords = ["testing", "selenium", "playwright", "self-healing", "test-automation", "semantic", "locator"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "playwright>=1.55.0",
    "sentence-transformers>=5.1.1",
    "numpy>=2.3.3",
    "beautifulsoup4>=4.12.2",
]

[project.scripts]
canvas-heal = "canvas_heal.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.1",
]

[project.urls]
Homepage = "https://github.com/mandavillivijay/CANVAS"
Issues = "https://github.com/mandavillivijay/CANVAS/issues"

[tool.hatch.build.targets.wheel]
packages = ["canvas_heal"]
